# /*---------------------------------------------------------------------------8
# |                                                                            |
# |   Playbook for Azure On-Demand Capacity Reservation (ODCR) Management     |
# |                                                                            |
# +------------------------------------4---------------------------------------*/
---

- hosts:                               localhost
  name:                                "ODCR Management: - Capacity Reservations"
  gather_facts:                        false
  
  tasks:
    - name:                            "ODCR Management: - Get resource group from inventory"
      ansible.builtin.shell: |
        grep 'resource_group_name' "{{ _workspace_directory }}/{{ lookup('env', 'ANSIBLE_INVENTORY') }}" | grep -v '#' | head -1 | awk -F': ' '{print $2}' | tr -d ' \r\n'
      register:                        rg_result
      changed_when:                    false

    - name:                            "ODCR Management: - Get subscription from inventory"
      ansible.builtin.shell: |
        grep 'subscription_id' "{{ _workspace_directory }}/{{ lookup('env', 'ANSIBLE_INVENTORY') }}" | grep -v '#' | head -1 | awk -F': ' '{print $2}' | tr -d ' \r\n'
      register:                        sub_result
      changed_when:                    false

    - name:                            "ODCR Management: - Validate inventory scope"
      ansible.builtin.assert:
        that:
          - rg_result.stdout | length > 0
          - sub_result.stdout is match('^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$')
        fail_msg:                      "The SID inventory must provide resource_group_name and a valid subscription_id."

    - name:                            "ODCR Management: - Set operation mode"
      ansible.builtin.set_fact:
        operation:                     "{{ odcr_action | default('create') }}"
        odcr_run_started:              "{{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}"

    - name:                            "ODCR Management: - Validate operation mode"
      ansible.builtin.assert:
        that:
          - operation in ['plan', 'create', 'info']
        fail_msg:                      "odcr_action must be plan, create or info."

    - name:                            "ODCR Management: - Ensure log directory exists"
      ansible.builtin.file:
        path:                          "{{ _workspace_directory }}/logs/odcr"
        state:                         directory
        mode:                          '0700'

    - name:                            "ODCR Management: - Create unique run log"
      ansible.builtin.tempfile:
        state:                         file
        path:                          "{{ _workspace_directory }}/logs/odcr"
        prefix:                        "odcr-{{ operation }}-{{ odcr_run_started }}-"
        suffix:                        ".log"
      register:                        odcr_log

    - name:                            "ODCR Management: - Initialize run log"
      ansible.builtin.copy:
        dest:                          "{{ odcr_log.path }}"
        mode:                          '0600'
        content: |
          Operation: {{ operation }}
          Resource group: {{ rg_result.stdout }}
          Subscription: {{ sub_result.stdout }}
          Started (UTC): {{ odcr_run_started }}
          Status: started; results have not been saved yet.
          An interrupted run may have changed Azure resources. Check Azure before retrying.

    - name:                            "ODCR Management: - Display configuration"
      ansible.builtin.debug:
        msg:
          - "Operation: {{ operation }}"
          - "Resource Group: {{ rg_result.stdout }}"
          - "Subscription: {{ sub_result.stdout }}"
          - "Location and VM membership: discovered from Azure VMs in the resource group"
          - "Tier override: {{ odcr_tier | default('<derived from resource group>') }}"
          - "Log file: {{ odcr_log.path }}"

    - name:                            "ODCR Management: - Run ODCR script"
      ansible.builtin.script:
        cmd:                           "{{ (playbook_dir ~ '/../scripts/odcr_management.sh') | quote }} {{ operation | quote }} {{ rg_result.stdout | quote }} {{ sub_result.stdout | quote }}"
      environment:
        ODCR_TIER:                     "{{ odcr_tier | default('') }}"
        ODCR_CENTRAL_RG:               "{{ odcr_central_resource_group | default('') }}"
        ODCR_CENTRAL_CRG:              "{{ odcr_central_crg_name | default('') }}"
        ODCR_CRG_ZONES:                "{{ odcr_crg_zones | default('1 2 3') }}"
        ODCR_SKU_CACHE_DIR:            "{{ odcr_sku_cache_directory | default('') }}"
        ODCR_SKU_CACHE_REFRESH:        "{{ odcr_sku_cache_refresh | default(false) | string | lower }}"
        ODCR_SHARE_SUBSCRIPTIONS:      "{{ (odcr_share_subscriptions | default([]) is string) | ternary(odcr_share_subscriptions | default(''), odcr_share_subscriptions | default([]) | join(' ')) }}"
      register:                        odcr_result
      failed_when:                     false

    - name:                            "ODCR Management: - Display results"
      ansible.builtin.debug:
        var:                           odcr_result.stdout_lines

    - name:                            "ODCR Management: - Save ODCR results to run log"
      ansible.builtin.copy:
        dest:                          "{{ odcr_log.path }}"
        mode:                          '0600'
        content: |
          Operation: {{ operation }}
          Resource group: {{ rg_result.stdout }}
          Subscription: {{ sub_result.stdout }}
          Started (UTC): {{ odcr_run_started }}
          Finished (UTC): {{ now(utc=true, fmt='%Y%m%dT%H%M%SZ') }}
          Status: completed
          Exit code: {{ odcr_result.rc | default('unavailable - script did not return an exit code') }}
          Ansible message: {{ odcr_result.msg | default('') }}

          STDOUT:
          {{ odcr_result.stdout | default('') }}

          STDERR:
          {{ odcr_result.stderr | default('') }}

    - name:                            "ODCR Management: - Display run log location"
      ansible.builtin.debug:
        msg:                           "ODCR results saved to {{ odcr_log.path }}"

    - name:                            "ODCR Management: - Fail if the ODCR script reported failures"
      ansible.builtin.fail:
        msg:                           "ODCR script failed (rc={{ odcr_result.rc | default('unavailable') }}). See {{ odcr_log.path }}. {{ odcr_result.stderr | default('') }} {{ odcr_result.msg | default('') }}"
      when:                            (odcr_result.rc | default(1)) != 0

    - name:                            "ODCR Management: - Ensure progress directory exists"
      ansible.builtin.file:
        path:                          "{{ _workspace_directory }}/.progress"
        state:                         directory
        mode:                          0755
      when:                            operation == 'create'

    - name:                            "ODCR Management: - Create completion flag"
      ansible.builtin.file:
        path:                          "{{ _workspace_directory }}/.progress/odcr-management-done"
        state:                         touch
        mode:                          0755
      when:                            operation == 'create'
